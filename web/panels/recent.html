<section class="panel" id="panel-recent">
    <div class="panel-header">
        <h2><i class="fas fa-history"></i> Recent Projects</h2>
        <p>Quick access to your recently opened projects</p>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Project Name</th>
                            <th>Package ID</th>
                            <th>Path</th>
                            <th>Last Opened</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="recentProjectsList">
                        <tr>
                            <td colspan="5" class="text-center text-muted">
                                <i class="fas fa-info-circle"></i> Loading recent projects...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
